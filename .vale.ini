StylesPath = .vale/styles
MinAlertLevel = suggestion
# Provenance only — the styles are vendored, so nothing re-fetches them.
# Refreshing is `vale sync` by hand plus a commit.
Packages = Microsoft, proselint, alex
Vocab = alunduil-infrastructure

# Fallback for markdown the sections below don't match; without it those
# files load no rules and pass unread. A section's own BasedOnStyles
# replaces this list rather than extending it, so each restates in full.
[*.md]
BasedOnStyles = Vale, alex

# Human-read prose.
[{README,docs/**/*}.md]
BasedOnStyles = Vale, Microsoft, proselint, alex

proselint.Cliches = NO   # overlaps Microsoft.Terms
proselint.Spelling = NO  # Vale.Spelling owns this

# Wants tight em-dashes; spaced ' — ' is this repo's style.
Microsoft.Dashes = NO
# Prefers 'address' over 'URL', but the how-tos name literal form fields
# ('Homepage URL', 'Callback URL') the operator has to find in a UI.
Microsoft.GeneralURL = NO
# Demands a definition for DNS, TTL, OIDC. The audience already
# administers these systems.
Microsoft.Acronyms = NO
# Semicolons are deliberate here, not a sentence-splitting failure.
Microsoft.Semicolon = NO
# 'Verify your use of X with the A-Z word list' carries no fix to apply.
Microsoft.Vocab = NO

# Claude-read instructions. Optimised for tokens, not readability, so the
# rules that inflate prose (sentence case, contractions, passive voice,
# 'e.g.' expansion) are absent.
[{CLAUDE,.claude/**/*}.md]
BasedOnStyles = Vale, alex

Microsoft.Adverbs = YES
Microsoft.Avoid = YES
Microsoft.Terms = YES
Microsoft.Wordiness = YES
