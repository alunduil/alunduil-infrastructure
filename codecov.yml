# Statuses are informational so a coverage drop annotates a pull request
# without blocking merge. kcov counts every line of a multi-line quoted string
# as uncovered, so the scripts built around long GraphQL queries report far
# below what their suites actually exercise — a gating threshold would fire on
# that artefact rather than on lost coverage.

coverage:
  # No explicit target: each status then compares against its own base commit,
  # so the floor tracks the codebase rather than a number someone picked once.
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
