---
- name: Forward packets for exit-node traffic
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
    mode: "0644"
  notify: Apply sysctl settings

- name: Join the tailnet as an exit node
  when: "'tailscale' in ansible_facts.packages or not ansible_check_mode"
  block:
    - name: Start Tailscale
      ansible.builtin.systemd_service:
        name: tailscaled
        enabled: true
        state: started

    - name: Read Tailscale's state
      ansible.builtin.command: tailscale status --json
      register: nanopi_neo3_tailscale_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Decide whether Tailscale needs logging in
      ansible.builtin.set_fact:
        nanopi_neo3_tailscale_running: >-
          {{ nanopi_neo3_tailscale_status.rc == 0
             and (nanopi_neo3_tailscale_status.stdout | from_json).BackendState == 'Running' }}

    - name: Ask for a Tailscale auth key
      ansible.builtin.pause:
        prompt: Tailscale auth key
        echo: false
      register: nanopi_neo3_tailscale_auth_key
      when: not nanopi_neo3_tailscale_running and not ansible_check_mode

    - name: Log in to Tailscale
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - --auth-key={{ nanopi_neo3_tailscale_auth_key.user_input }}
          - --advertise-exit-node
          - --ssh
      changed_when: true
      no_log: true
      when: not nanopi_neo3_tailscale_running

    - name: Read Tailscale's preferences
      ansible.builtin.command: tailscale debug prefs
      register: nanopi_neo3_tailscale_prefs
      changed_when: false
      check_mode: false
      when: nanopi_neo3_tailscale_running

    - name: Advertise the exit node and Tailscale SSH
      ansible.builtin.command: tailscale set --advertise-exit-node --ssh
      changed_when: true
      when:
        - nanopi_neo3_tailscale_running
        - >-
          not (nanopi_neo3_tailscale_prefs.stdout | from_json).RunSSH
          or '0.0.0.0/0' not in (nanopi_neo3_tailscale_prefs.stdout | from_json).AdvertiseRoutes
          or '::/0' not in (nanopi_neo3_tailscale_prefs.stdout | from_json).AdvertiseRoutes
