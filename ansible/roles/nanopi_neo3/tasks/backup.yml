---
- name: Look for the hourly Drive sync
  ansible.builtin.stat:
    path: /etc/systemd/system/rclone-backup.timer
  register: nanopi_neo3_backup_timer

- name: Stop the hourly Drive sync
  ansible.builtin.systemd_service:
    name: rclone-backup.timer
    state: stopped
    enabled: false
  when: nanopi_neo3_backup_timer.stat.exists

- name: Remove the Drive sync's units
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item }}
    state: absent
  loop:
    - rclone-backup.service
    - rclone-backup.timer
  notify: Reload systemd

- name: Remove rclone's configuration
  ansible.builtin.file:
    path: /root/.config/rclone
    state: absent

- name: Remove rclone
  ansible.builtin.apt:
    name: rclone
    state: absent
    purge: true
