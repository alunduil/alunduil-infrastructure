---
# The journal is persistent and Alloy ships it, so rsyslog's text files only
# duplicate it.
- name: Remove rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: absent
    purge: true

- name: Remove rsyslog's text logs
  ansible.builtin.file:
    path: /var/log/{{ item }}
    state: absent
  loop:
    - auth.log
    - cron.log
    - daemon.log
    - debug
    - kern.log
    - mail.err
    - mail.info
    - mail.log
    - mail.warn
    - messages
    - syslog
    - user.log
