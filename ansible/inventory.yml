---
all:
  vars:
    # The operator's SSH can't resolve tailnet names, so tailscale nc connects.
    # Tailscale's known-hosts file lists each host by its fully qualified name
    # with a trailing dot, which ansible_host must match.
    ansible_ssh_common_args: >-
      -o ProxyCommand="tailscale nc %h %p"
      -o UserKnownHostsFile=~/.config/tailscale/ssh_known_hosts
      -o StrictHostKeyChecking=yes
  hosts:
    nanopi-neo3:
      ansible_host: nanopi-neo3.tail3af06.ts.net.
