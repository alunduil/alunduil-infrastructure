---
# SPDX-FileCopyrightText: 2026 Alex Brandt <alunduil@gmail.com>
# SPDX-License-Identifier: MIT

# Pre-commit hooks for code quality and consistency
# See https://pre-commit.com for more information

# Neither tree is ours to reformat: vendored styles belong to upstream, and
# license texts have to stay byte-exact. The lookahead keeps config/, which
# holds this project's own vocabulary.
exclude: ^(\.vale/styles/(?!config/)|LICENSES/)

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: '\.jsonc$'
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # No sync hook: the styles are vendored, so the gate needs no network.
  - repo: https://github.com/errata-ai/vale
    rev: v3.24.0
    hooks:
      - id: vale
        args: [--output=line, --minAlertLevel=error]
        types: [markdown]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Project spec validation
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-jsonschema
        name: check project spec schema
        files: ^github/projects/[^/]+\.json$
        exclude: \.schema\.json$
        args: [--schemafile, github/projects/project.schema.json]

  # Shell script linting and formatting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-i, '2', -ci, -bn, -d]

  # Terraform formatting and validation
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt
        args: [--args=-recursive]
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false

  # REUSE — SPDX license compliance
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse
        always_run: true

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        # Online audits need a token, so they stay out of the commit gate.
        args: [--no-progress, --offline]

  # Renovate config validation
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.235.4
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # justfile format and parse check
  - repo: local
    hooks:
      # The PyPI wheel ships a prebuilt binary, where upstream's hooks build
      # from Go source. jactionlint checks `run:` scripts only when
      # shellcheck is on PATH, and finds the files it lints itself.
      - id: jactionlint
        name: jactionlint
        entry: jactionlint
        language: python
        additional_dependencies: [jactionlint==2.6.0, shellcheck-py==0.11.0.1]
        pass_filenames: false
        files: ^\.github/

      - id: just-fmt-check
        name: just --fmt --check
        entry: just --fmt --check
        language: system
        files: ^justfile$
        pass_filenames: false
