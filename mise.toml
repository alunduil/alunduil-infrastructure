[settings]
locked = true
lockfile_platforms = ["linux-x64"]

[tools]
# ansible-core comes from the pypi backend, which needs python and uv pinned too.
ansible-core = "2.22.0"
bats = "1.14.0"
just = "1.59.0"
prek = "0.5.10"
promtool = "3.16.0"
python = "3.14.10"
terraform = "1.17.2"
uv = "0.13.8"
