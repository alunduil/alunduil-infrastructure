name: Set up mise
description: Installs the same mise version as the devcontainer.

inputs:
  install_args:
    description: Tools to install from mise.lock.
    required: true

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        version: 2026.11.8
        install_args: ${{ inputs.install_args }}
