name: Set up mise
description: Installs the same mise version as the devcontainer.

inputs:
  install_args:
    description: Tools to install from mise.lock.
    required: true

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        version: 2026.11.9
        install_args: ${{ inputs.install_args }}
