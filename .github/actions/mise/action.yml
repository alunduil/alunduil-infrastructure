name: Set up mise
description: Installs the same mise version as the devcontainer.

inputs:
  install_args:
    description: Tools to install from mise.lock.
    required: true

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        version: 2026.10.25
        install_args: ${{ inputs.install_args }}
