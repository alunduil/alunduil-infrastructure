name: Set up mise
description: Installs the same mise version as the devcontainer.

inputs:
  install_args:
    description: Tools to install from mise.lock.
    required: true

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: 2026.11.14
        install_args: ${{ inputs.install_args }}
