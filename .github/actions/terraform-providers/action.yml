name: Set up Terraform providers
description: >-
  Restores a provider mirror keyed on the lock files and points terraform
  init at it, so a warm cache installs every root without the registry.

runs:
  using: composite
  steps:
    - id: mirror
      shell: bash
      run: echo "dir=$RUNNER_TEMP/terraform-providers" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.mirror.outputs.dir }}
        key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}

    # Mirrors the roots the cache key hashes, not only the ones the calling
    # workflow inits: every workflow restores the same key.
    - name: Mirror providers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        MIRROR: ${{ steps.mirror.outputs.dir }}
      run: |
        shopt -s globstar
        for lock in terraform/**/.terraform.lock.hcl; do
          root=$(dirname "$lock")
          terraform -chdir="$root" get
          for attempt in 1 2 3; do
            terraform -chdir="$root" providers mirror "$MIRROR" && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 30
          done
        done

    # Mirror as the sole installation method: adding direct {} makes init
    # query the registry for available versions even when the mirror holds
    # them. Packages are still checked against the lock file's hashes.
    - name: Point Terraform at the mirror
      shell: bash
      env:
        MIRROR: ${{ steps.mirror.outputs.dir }}
      run: |
        config="$RUNNER_TEMP/terraformrc"
        cat > "$config" <<EOF
        provider_installation {
          filesystem_mirror {
            path = "$MIRROR"
          }
        }
        EOF
        echo "TF_CLI_CONFIG_FILE=$config" >> "$GITHUB_ENV"
