name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'terraform/alunduil/**'
      - 'terraform/modules/**'
      - '.github/workflows/terraform-apply.yml'
      - '.github/actions/terraform-providers/**'
      - 'scripts/export-terraform-credentials.sh'
      - 'mise.toml'
      - 'mise.lock'

permissions:
  contents: read

# Serializes every run touching the shared GCS state: applies here, plus
# the PR plans that join this group from terraform-plan.yml. queue: max
# carries two guarantees: it forbids cancel-in-progress: true, so no
# arrival interrupts a write and orphans the state lock, and it queues
# runs the default single slot would cancel — a pending apply among them.
concurrency:
  group: terraform-state
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - uses: ./.github/actions/terraform-providers

      # Read-write deployer SA: gated to refs/heads/main by the WIF binding.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_RW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RW_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Provider credentials live in Secret Manager, not GitHub secrets.
      - name: Export provider credentials
        run: scripts/export-terraform-credentials.sh rw

      - name: Terraform Init
        working-directory: terraform/alunduil
        run: terraform init

      # plan-then-apply (not apply direct) so the applied diff is the same
      # one the PR's terraform-plan comment showed.
      - name: Terraform Plan
        working-directory: terraform/alunduil
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform plan -lock=false -no-color -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/alunduil
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform apply -auto-approve tfplan
