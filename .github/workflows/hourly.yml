name: Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox:
    name: Sync the Inbox board
    runs-on: ubuntu-latest
    environment: project-sync
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run sync against github/projects/inbox.json
        env:
          # One token serves every board the script syncs. Scopes:
          # docs/how-to/create-github-project-sync-token.md.
          GH_PROJECT_SYNC_TOKEN: ${{ secrets.GH_PROJECT_SYNC_TOKEN }}
        run: ./scripts/sync-project.sh github/projects/inbox.json
