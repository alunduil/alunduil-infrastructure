---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main keeps a complete CI result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Some hooks shell out to terraform and just rather than bringing their
    # own.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Terraform and just
        uses: ./.github/actions/mise
        with:
          install_args: terraform just

      - name: Set up Terraform providers
        uses: ./.github/actions/terraform-providers

      - name: Run pre-commit hooks
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: 'v0.5.11'
        env:
          # no-commit-to-branch is a local guard that fails every push to main.
          SKIP: no-commit-to-branch

  # Not in `Check CI results`' needs: it skips on non-Renovate pull requests,
  # which that job counts as a failure.
  fix-renovate-hooks:
    name: Fix hooks on Renovate branches
    permissions:
      contents: read
      id-token: write
    # A SHA-pinned reusable workflow can't be wrapped.
    # yamllint disable rule:line-length
    uses: alunduil/renovate-config/.github/workflows/fix-renovate-hooks.yml@9254b2f23fe548386a75265b839e4d005c7a7b36 # main
    # yamllint enable rule:line-length
    with:
      hook-runner: prek
      # terraform_fmt is the only fixing hook that needs a tool prek doesn't
      # install.
      setup: scripts/install-terraform.sh

  bats:
    name: Run bats suites
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # A job-level block replaces the workflow-level one, so the checkout
      # needs `contents` again.
      contents: read
      # codecov-action authenticates by OIDC, so there is no upload token to
      # store or rotate.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up bats
        uses: ./.github/actions/mise
        with:
          install_args: bats

      # Apt mirrors can stall, so this step fails well before the job timeout.
      # apt's default output tells a slow mirror from a lock wait.
      - name: Install kcov build dependencies
        timeout-minutes: 5
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y cmake ninja-build binutils-dev \
            libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev libssl-dev

      - name: Install kcov
        run: |
          scripts/install-kcov.sh --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run suites
        run: |
          kcov --include-path=github/projects,scripts \
            --exclude-pattern=.bats \
            coverage bats --recursive github/projects scripts

      # kcov writes to coverage/bats.<hash>/ and symlinks coverage/bats beside
      # it; the symlink is the only stable path.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/bats/cobertura.xml
          disable_search: true
          flags: bats

  terraform-test:
    name: Test Terraform modules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Terraform and just
        uses: ./.github/actions/mise
        with:
          install_args: terraform just

      - name: Set up Terraform providers
        uses: ./.github/actions/terraform-providers

      - name: Run module tests
        run: just test-terraform

  dependency-review:
    name: Review dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ansible-check:
    name: Check the Ansible playbook against a container
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Ansible
        uses: ./.github/actions/mise
        with:
          install_args: python uv ansible-core just

      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Start the stand-in host
        run: |
          docker build --platform linux/arm64 --tag ansible-stand-in ansible
          docker run --platform linux/arm64 --detach --name ansible-stand-in ansible-stand-in
          test "$(docker exec ansible-stand-in uname -m)" = aarch64

      # Extra vars outrank inventory vars, so the real inventory's host
      # resolves to the container.
      - name: Run the playbook in check mode
        run: >-
          just nanopi-neo3 --check --diff
          --extra-vars ansible_connection=community.docker.docker
          --extra-vars ansible_host=ansible-stand-in

  # The default-branch ruleset requires this check by name, so renaming the
  # job breaks the merge gate.
  results:
    name: Check CI results
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - pre-commit
      - bats
      - terraform-test
      - ansible-check
      - dependency-review
    if: always()
    steps:
      # Pull-request-only jobs skip on a push to main.
      - name: Fail when any job did not succeed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (github.event_name == 'pull_request' && contains(needs.*.result, 'skipped'))
        run: exit 1
