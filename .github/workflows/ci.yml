---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main keeps a complete CI result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Some hooks shell out to terraform and just rather than bringing their
    # own.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform and just
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: terraform just

      - name: Set up Terraform providers
        uses: ./.github/actions/terraform-providers

      - name: Run pre-commit hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: '0.5.7'
        env:
          # no-commit-to-branch is a local guard that fails every push to main.
          SKIP: no-commit-to-branch

  # Skipped outside Renovate pull requests, so `Check CI results` doesn't
  # need it.
  fix-renovate-hooks:
    name: Fix hooks on Renovate branches
    permissions:
      contents: read
      id-token: write
    # A reusable workflow's path plus its SHA pin can't fit 100 characters.
    # yamllint disable rule:line-length
    uses: alunduil/renovate-config/.github/workflows/fix-renovate-hooks.yml@ff872063ec22851e3a0e9d331a631fe61df40f57 # main
    # yamllint enable rule:line-length
    with:
      hook-runner: prek
      # terraform_fmt is the only fixing hook that needs a tool prek doesn't
      # install.
      setup: >-
        scripts/install-terraform.sh --bin-dir "${HOME}/.local/bin"
        && echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

  bats:
    name: Run bats suites
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # A job-level block replaces the workflow-level one, so the checkout
      # needs `contents` again.
      contents: read
      # codecov-action authenticates by OIDC, so there is no upload token to
      # store or rotate.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up bats
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: bats

      - name: Install kcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build binutils-dev \
            libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev libssl-dev
          scripts/install-kcov.sh --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run suites
        run: |
          kcov --include-path=github/projects,scripts \
            --exclude-pattern=.bats \
            coverage bats --recursive github/projects scripts

      # kcov writes to coverage/bats.<hash>/ and symlinks coverage/bats beside
      # it; the symlink is the only stable path.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/bats/cobertura.xml
          disable_search: true
          flags: bats

  dependency-review:
    name: Review dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # The default-branch ruleset requires this check by name, so renaming the
  # job breaks the merge gate.
  results:
    name: Check CI results
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - pre-commit
      - bats
      - dependency-review
    if: always()
    steps:
      # Pull-request-only jobs skip on a push to main.
      - name: Fail when any job did not succeed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (github.event_name == 'pull_request' && contains(needs.*.result, 'skipped'))
        run: exit 1
