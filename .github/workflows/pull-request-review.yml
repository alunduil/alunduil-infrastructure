---
name: Pull Request Review

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  # A failed required check stays failed after another run of the same name
  # passes, so the failed runs themselves must re-run. The re-run clears both
  # the held Terraform plan and the Renovate commit check.
  rerun-renovate-commit-checks:
    name: Re-run Renovate commit checks
    permissions:
      actions: write
    # yamllint disable-line rule:line-length
    uses: alunduil/renovate-config/.github/workflows/rerun-renovate-commit-checks.yml@6052341d076d02929cd58ba8a5245d4cf13955af # main
