name: Terraform Plan

# The read-only Tailscale credential matches this file's path in
# job_workflow_ref, so the plan keeps its own workflow.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A required check skipped by a trigger paths: filter stays Pending forever.
  # One skipped by a job's if: reports Success.
  #
  # Plan queues for the terraform-state slot before its first step, so
  # filtering inside it would hold every pull request behind an in-flight
  # apply.
  #
  # This job runs no action and nothing from the checkout, so an update under
  # review can't change its result. The hook-fix App can't edit workflows, so
  # its logic stays inline.
  changes:
    name: Detect Terraform changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          paths='^(terraform/alunduil/|terraform/modules/|\.github/actions/mise/|\.github/actions/terraform-providers/|(\.github/workflows/terraform-plan\.yml|scripts/export-terraform-credentials\.sh|scripts/eval-recording-rules\.sh|scripts/test-dora-alert\.sh|mise\.toml|mise\.lock)$)'
          if grep -Eq "${paths}" <<<"${files}"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

      # Plan runs an update's actions, tools, and providers with its
      # credentials, so an update waits until the admin approves its head
      # commit. pull-request-review.yml then re-runs this job, and plan with
      # it.
      - name: Hold a Renovate update until the admin approves it
        if: steps.diff.outputs.changed == 'true' && startsWith(github.head_ref, 'renovate/')
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          state="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/reviews" \
            --jq '.[] | select(.user.login == env.OWNER and .commit_id == env.HEAD_SHA)
              | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED") | .state' \
            | tail -n 1)"
          if [[ ${state} != APPROVED ]]; then
            echo "::error::Plan would run this update's code with its credentials."
            echo "::notice::Read the update, then approve ${HEAD_SHA} to run the plan."
            exit 1
          fi

  # The default-branch ruleset requires this check by name, so renaming the
  # job breaks the merge gate.
  plan:
    name: Plan Terraform changes
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Joins terraform-apply.yml's group so a plan waits out an in-flight
    # apply. The read-only deployer SA can't write a .tflock object, so the
    # plan below runs -lock=false and would otherwise plan against state
    # an apply has already superseded. Job level, not workflow level, so the
    # per-ref group above still supersedes this PR's own in-flight plan.
    concurrency:
      group: terraform-state
      queue: max
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      resource_changes: ${{ steps.resource-changes.outputs.count }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/mise
        with:
          install_args: terraform promtool

      - uses: ./.github/actions/terraform-providers

      # Read-only deployer SA: plan reads state but never mutates GCP.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_RO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RO_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # Provider credentials live in Secret Manager, not GitHub secrets.
      - name: Export provider credentials
        run: scripts/export-terraform-credentials.sh ro

      # The alunduil-terraform-plan App's token spans every managed repo and
      # writes none of them.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.TERRAFORM_GITHUB_APP_ID }}
          private-key: ${{ env.TERRAFORM_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Terraform Init
        working-directory: terraform/alunduil
        run: terraform init

      # No refresh: GitHub hides merge settings and ruleset bypass actors from
      # a read-only token, so a refresh reads them as blank and plans changes
      # the repos don't need. The diff runs against the state apply last
      # refreshed.
      - name: Terraform Plan
        working-directory: terraform/alunduil
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          terraform plan -lock=false -refresh=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment PR with plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/alunduil/plan.txt', 'utf8');
            const m = plan.match(/^(No changes\..+|Plan: .+)$/m);
            const summary = m ? m[0] : 'Plan generated';
            // GitHub rejects a comment over 65,536 characters; the plan step's
            // log keeps the whole plan.
            const limit = 60000;
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const shown = plan.length > limit
              ? `${plan.slice(0, limit)}\n… truncated; the full plan is in ${run}`
              : plan;
            const marker = '<!-- terraform-plan:alunduil -->';
            const body = [
              marker,
              '## terraform-plan',
              '',
              `**${summary}**`,
              '',
              '<details>',
              '<summary>Show full plan output</summary>',
              '',
              '```',
              shown,
              '```',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const hit = comments.find((c) => c.body.includes(marker));
            if (hit) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: hit.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Evaluate planned recording rules
        working-directory: terraform/alunduil
        run: |
          terraform show -json tfplan > plan.json
          ../../scripts/eval-recording-rules.sh plan.json

      - name: Test the DORA alert's timelines
        working-directory: terraform/alunduil
        run: ../../scripts/test-dora-alert.sh plan.json

      # Data sources read during apply change nothing.
      - id: resource-changes
        name: Count planned resource changes
        working-directory: terraform/alunduil
        run: |
          count=$(jq '[.resource_changes[]?
            | select(.mode == "managed" and .change.actions != ["no-op"])]
            | length' plan.json)
          echo "count=${count}" >> "$GITHUB_OUTPUT"

  # Gates renovate.json's automerge of updates that trigger an apply.
  # Only required checks block Renovate's merge. Each pull request's body says
  # whether Renovate automerges or holds it. A held pull request with
  # auto-merge off passes with any plan, because the admin merges it.
  #
  # The admin-bypassable-checks ruleset requires this check by name, so
  # renaming the job breaks the merge gate.
  renovate-plan:
    name: Confirm lock file maintenance plans no changes
    needs: plan
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Renovate pushes before it edits the body, so the event's body can be
      # stale. Reading the pull request also lets a re-run see an edited body.
      - name: Fail on planned changes
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          RESOURCE_CHANGES: ${{ needs.plan.outputs.resource_changes }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" > pull_request.json
          scripts/check-renovate-plan.sh pull_request.json "${RESOURCE_CHANGES}"
