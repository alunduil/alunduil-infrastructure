name: Terraform Plan

# The read-only Tailscale credential matches this file's path in
# job_workflow_ref, so the plan keeps its own workflow.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A required check skipped by a trigger paths: filter stays Pending forever;
  # one skipped by a job's if: reports Success. Plan queues for the
  # terraform-state slot before its first step, so filtering inside it would
  # hold every pull request behind an in-flight apply.
  changes:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      # HEAD is the pull request's merge commit, so HEAD^1 is the base tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- \
            terraform/alunduil \
            terraform/modules \
            .github/workflows/terraform-plan.yml \
            .github/actions/terraform-providers \
            scripts/export-terraform-credentials.sh \
            scripts/eval-recording-rules.sh \
            mise.toml \
            mise.lock
          then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi

  # The default-branch ruleset requires this check by name, so renaming the
  # job breaks the merge gate.
  plan:
    name: Plan Terraform changes
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Joins terraform-apply.yml's group so a plan waits out an in-flight
    # apply. The read-only deployer SA can't write a .tflock object, so the
    # plan below runs -lock=false and would otherwise plan against state
    # an apply has already superseded. Job level, not workflow level, so the
    # per-ref group above still supersedes this PR's own in-flight plan.
    concurrency:
      group: terraform-state
      queue: max
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: terraform

      - uses: ./.github/actions/terraform-providers

      # Read-only deployer SA: plan reads state but never mutates GCP.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_RO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RO_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # Provider credentials live in Secret Manager, not GitHub secrets.
      - name: Export provider credentials
        run: scripts/export-terraform-credentials.sh ro

      # The alunduil-terraform-plan App's token spans every managed repo and
      # writes none of them.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.TERRAFORM_GITHUB_APP_ID }}
          private-key: ${{ env.TERRAFORM_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Terraform Init
        working-directory: terraform/alunduil
        run: terraform init

      # No refresh: GitHub hides merge settings and ruleset bypass actors from
      # a read-only token, so a refresh reads them as blank and plans changes
      # the repos don't need. The diff runs against the state apply last
      # refreshed.
      - name: Terraform Plan
        working-directory: terraform/alunduil
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          terraform plan -lock=false -refresh=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment PR with plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/alunduil/plan.txt', 'utf8');
            const m = plan.match(/^(No changes\..+|Plan: .+)$/m);
            const summary = m ? m[0] : 'Plan generated';
            // GitHub rejects a comment over 65,536 characters; the plan step's
            // log keeps the whole plan.
            const limit = 60000;
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const shown = plan.length > limit
              ? `${plan.slice(0, limit)}\n… truncated; the full plan is in ${run}`
              : plan;
            const marker = '<!-- terraform-plan:alunduil -->';
            const body = [
              marker,
              '## terraform-plan',
              '',
              `**${summary}**`,
              '',
              '<details>',
              '<summary>Show full plan output</summary>',
              '',
              '```',
              shown,
              '```',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const hit = comments.find((c) => c.body.includes(marker));
            if (hit) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: hit.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Evaluate planned recording rules
        working-directory: terraform/alunduil
        run: |
          terraform show -json tfplan > plan.json
          ../../scripts/eval-recording-rules.sh plan.json
